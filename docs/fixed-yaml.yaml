                                                            hrbds_csclookupsid =
                                                                _source.hrbds_registrationstatuslookupcode
                                                        )
                                                )
                                            );
                                            UpdateContext(
                                                {
                                                    locSessionRefreshedAt: Now(),
                                                    locSessionSelectedRegistration: Blank()
                                                }
                                            )
                                          PressedBorderColor: =myTheme.SecondaryPressed
                                          PressedColor: =myTheme.SecondaryText
