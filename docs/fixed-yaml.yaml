Screens:
  Session Details | Détails de la séance:
    Properties:
      Fill: =myTheme.Background
      OnHidden: |-
        =UpdateContext(
            {
                locTrainingSessionID: Blank(),
                locTrainingSessionRecord: Blank(),
                locSessionSelectedView: "REGISTRATIONS",
                locSessionSelectedRegistration: Blank()
            }
        );
        Clear(locSessionRegistrati0ns)
      OnVisible: |-
        =UpdateContext(
            {
                locTrainingSessionRecord:
                    LookUp(
                        'CSC Training Sessions',
                        'CSC Training Sessions ID' =
                            Coalesce(
                                locTrainingSessionID,
                                IfError(
                                    GUID(Param("session-id")),
                                    Blank()
                                )
                            )
                    ),
                locSortCourseListColumn:
                    Coalesce(
                        locSortCourseListColumn,
                        "AssignedAreaDisplayText"
                    ),
                locSortType:
                    Coalesce(
                        locSortType,
                        SortOrder.Ascending
                    ),
                locSessionSelectedView: "REGISTRATIONS",
                locSessionSelectedRegistration: Blank(),
                locSessionRefreshedAt: Now()
            }
        );
        Select(session_btn_ReloadRegistrations)
    Children:
      - session_con_Root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =myTheme.Background
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            Width: =App.Width
          Children:
            - session_cmp_SideMenu:
                Control: CanvasComponent
                ComponentName: _cx_nav_SideMenu
                Properties:
                  AppName: =nfBi("HR Learning Hub", "Carrefour d'apprentissage des RH")
                  CollapsedWidth: =75
                  ExpandedWidth: =320
                  Fill: =myTheme.Transparent
                  Height: =App.Height
                  HelpURL: =""
                  Logo: =img.Home
                  LogoCompact: =img.Report
                  MenuItems: =tbl.Menus
                  ProfileImage: =User().Image
                  ProfileName: =User().FullName
                  ProfileRole: =nfBi("Employee", "Employé")
                  Width: |-
                    =If(
                        SideMenuCollapsed,
                        Self.CollapsedWidth,
                        Self.ExpandedWidth
                    )
                  svgMode: =true
            - session_con_Main:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =myTheme.Background
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =10
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =8
                Children:
                  - session_cmp_HeaderBar:
                      Control: CanvasComponent
                      ComponentName: _cx_nav_HeaderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Fill: =myTheme.Transparent
                        Height: =60
                        LayoutMinHeight: =60
                        LayoutMinWidth: =0
                        NavItems: =tbl.Tabs.Requests
                        Width: =Parent.Width
                        svgMode: =true
                  - session_con_Hero:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =myTheme.Surface
                        FillPortions: =0
                        Height: =132
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =14
                        LayoutMinHeight: =132
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - session_con_HeroContent:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =myTheme.Transparent
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =0
                              LayoutMinWidth: =260
                            Children:
                              - session_con_Badges:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =myTheme.Transparent
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =28
                                    LayoutMinWidth: =0
                                  Children:
                                    - session_lbl_CourseCode:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          Color: =myTheme.SelectionText
                                          Fill: =myTheme.Selection
                                          Font: =Font.Lato
                                          FontWeight: =FontWeight.Bold
                                          Height: =26
                                          LayoutMinHeight: =26
                                          LayoutMinWidth: =80
                                          PaddingBottom: =0
                                          PaddingLeft: =8
                                          PaddingRight: =8
                                          PaddingTop: =0
                                          Size: =9
                                          Text: =Coalesce(locTrainingSessionRecord.Course.Code, "–")
                                          Width: =100
                                    - session_lbl_Region:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          Color: =myTheme.InformationBackgroundText
                                          Fill: =myTheme.InformationBackground
                                          Font: =Font.Lato
                                          FontWeight: =FontWeight.Bold
                                          Height: =26
                                          LayoutMinHeight: =26
                                          LayoutMinWidth: =70
                                          PaddingBottom: =0
                                          PaddingLeft: =8
                                          PaddingRight: =8
                                          PaddingTop: =0
                                          Size: =9
                                          Text: =Coalesce(locTrainingSessionRecord.'Coordinating Regional Campus'.Code, "–")
