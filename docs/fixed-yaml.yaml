                                          HoverColor: =myTheme.SecondaryText
                                          HoverFill: =myTheme.SecondaryHover
                                          LayoutMinHeight: =40
                                          LayoutMinWidth: =110
                                          OnSelect: |-
                                            =ClearCollect(
                                                locSessionRegistrati0ns,
                                                AddColumns(
                                                    ForAll(
