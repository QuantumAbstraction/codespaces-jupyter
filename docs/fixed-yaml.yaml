                                    - session_lbl_Category:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          Color: =myTheme.Text
                                          Fill: =myTheme.SurfaceSubtle
                                          Font: =Font.Lato
                                          FontWeight: =FontWeight.Semibold
                                          Height: =26
                                          LayoutMinHeight: =26
                                          LayoutMinWidth: =140
                                          PaddingBottom: =0
                                          PaddingLeft: =8
                                          PaddingRight: =8
                                          PaddingTop: =0
                                          Size: =9
