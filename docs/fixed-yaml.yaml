                                          LayoutMinWidth: =22
                                          PressedColor: =myTheme.IconsMuted
                                          TabIndex: =0
                                          Tooltip: =nfBi("Delivery method", "Mode de prestation")
                                          Width: =22
                                    - session_lbl_Delivery:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =myTheme.TextMuted
                                          Fill: =myTheme.Transparent
                                          FillPortions: =1
                                          Font: =Font.Lato
                                          FontWeight: =FontWeight.Semibold
                                          Height: =24
                                          LayoutMinHeight: =24
                                          LayoutMinWidth: =100
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =10
                                          Text: |-
                                            =nfBi(
                                                locTrainingSessionRecord.Course.'Delivery Method EN',
                                                locTrainingSessionRecord.Course.'Delivery Method FR'
                                            )
                        - session_btn_Back:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =myTheme.Secondary
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =2
                              Color: =myTheme.Secondary
                              DisabledBorderColor: =myTheme.Border
                              DisabledColor: =myTheme.DisabledText
                              DisabledFill: =myTheme.Transparent
                              Fill: =myTheme.Transparent
                              FocusedBorderColor: =myTheme.Focus
                              FocusedBorderThickness: =2
                              Font: =Font.Lato
                              FontWeight: =FontWeight.Bold
                              Height: =40
                              HoverBorderColor: =myTheme.SecondaryHover
                              HoverColor: =myTheme.SecondaryText
                              HoverFill: =myTheme.SecondaryHover
                              LayoutMinHeight: =40
                              LayoutMinWidth: =130
                              OnSelect: |-
                                =Navigate(
                                    'All Training Sessions | Toutes les séances de formation',
                                    ScreenTransition.CoverRight
                                )
                              PressedBorderColor: =myTheme.SecondaryPressed
                              PressedColor: =myTheme.SecondaryText
                              PressedFill: =myTheme.SecondaryPressed
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =10
                              Text: =nfBi("Back to sessions", "Retour aux séances")
                              Tooltip: =nfBi("Return to all training sessions", "Revenir à toutes les séances de formation")
                              Width: =150
                  - session_con_Workspace:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =myTheme.Transparent
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =If(App.Width < 1050, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - session_con_Information:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =myTheme.Surface
                              FillPortions: =0
                              Height: =If(App.Width < 1050, 420, Parent.Height)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =390
                              LayoutMinWidth: =290
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =If(App.Width < 1050, Parent.Width, Min(390, Parent.Width * 0.34))
                            Children:
                              - session_lbl_InformationHeading:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =myTheme.Text
                                    Fill: =myTheme.Transparent
                                    Font: =Font.Lato
                                    FontWeight: =FontWeight.Bold
                                    Height: =36
                                    LayoutMinHeight: =36
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =15
                                    Text: =nfBi("Session information", "Renseignements sur la séance")
                              - session_con_LanguageInfo:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =myTheme.SurfaceSubtle
                                    FillPortions: =0
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    LayoutMinHeight: =64
                                    LayoutMinWidth: =0
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                  Children:
                                    - session_ico_Language:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          AccessibleLabel: =nfBi("Delivery language", "Langue de prestation")
                                          Color: =myTheme.Icons
                                          Height: =28
                                          HoverColor: =myTheme.Icons
                                          Icon: =Icon.Globe
                                          LayoutMinHeight: =28
                                          LayoutMinWidth: =28
                                          PressedColor: =myTheme.Icons
                                          TabIndex: =0
                                          Tooltip: =nfBi("Delivery language", "Langue de prestation")
                                          Width: =28
                                    - session_con_LanguageText:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =myTheme.Transparent
                                          FillPortions: =1
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =0
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =100
                                        Children:
                                          - session_lbl_LanguageHeader:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =myTheme.TextMuted
                                                Fill: =myTheme.Transparent
                                                Font: =Font.Lato
                                                FontWeight: =FontWeight.Semibold
                                                Height: =24
                                                LayoutMinHeight: =24
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =9
                                                Text: =nfBi("Delivery language", "Langue de prestation")
                                          - session_lbl_LanguageValue:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =myTheme.Text
                                                Fill: =myTheme.Transparent
                                                Font: =Font.Lato
                                                FontWeight: =FontWeight.Bold
                                                Height: =26
                                                LayoutMinHeight: =26
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: |-
                                                  =nfBi(
                                                      locTrainingSessionRecord.'Session Language'.EN,
                                                      locTrainingSessionRecord.'Session Language'.FR
                                                  )
                              - session_con_DateInfo:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =myTheme.SurfaceSubtle
                                    FillPortions: =0
                                    Height: =72
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    LayoutMinHeight: =72
                                    LayoutMinWidth: =0
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                  Children:
                                    - session_ico_Date:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          AccessibleLabel: =nfBi("Session date", "Date de la séance")
                                          Color: =myTheme.Icons
                                          Height: =28
                                          HoverColor: =myTheme.Icons
                                          Icon: =Icon.CalendarBlank
                                          LayoutMinHeight: =28
                                          LayoutMinWidth: =28
                                          PressedColor: =myTheme.Icons
                                          TabIndex: =0
                                          Tooltip: =nfBi("Session date", "Date de la séance")
                                          Width: =28
                                    - session_con_DateText:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =myTheme.Transparent
                                          FillPortions: =1
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =0
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =100
                                        Children:
                                          - session_lbl_DateHeader:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =myTheme.TextMuted
                                                Fill: =myTheme.Transparent
                                                Font: =Font.Lato
                                                FontWeight: =FontWeight.Semibold
                                                Height: =24
                                                LayoutMinHeight: =24
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =9
                                                Text: =nfBi("Date", "Date")
                                          - session_lbl_DateValue:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =myTheme.Text
                                                Fill: =myTheme.Transparent
                                                Font: =Font.Lato
                                                FontWeight: =FontWeight.Bold
                                                Height: =36
                                                LayoutMinHeight: =36
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =10
                                                Text: |-
                                                  =With(
                                                      {
                                                          _showEnd:
                                                              !IsBlank(locTrainingSessionRecord.'End Date') &&
                                                              locTrainingSessionRecord.'Start Date' <>
                                                                  locTrainingSessionRecord.'End Date'
                                                      },
                                                      Text(
                                                          locTrainingSessionRecord.'Start Date',
                                                          If(
                                                              ShowFrench,
                                                              "[$-fr-CA]dddd d mmmm yyyy",
                                                              "[$-en-CA]dddd, mmmm d, yyyy"
                                                          )
                                                      ) &
                                                      If(
                                                          _showEnd,
                                                          nfBi(" to ", " au ") &
                                                          Text(
                                                              locTrainingSessionRecord.'End Date',
                                                              If(
                                                                  ShowFrench,
                                                                  "[$-fr-CA]dddd d mmmm yyyy",
                                                                  "[$-en-CA]dddd, mmmm d, yyyy"
                                                              )
                                                          ),
                                                          ""
                                                      )
                                                  )
                              - session_con_TimeInfo:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =myTheme.SurfaceSubtle
                                    FillPortions: =0
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    LayoutMinHeight: =64
                                    LayoutMinWidth: =0
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                  Children:
                                    - session_ico_Time:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          AccessibleLabel: =nfBi("Session time", "Heure de la séance")
                                          Color: =myTheme.Icons
                                          Height: =28
                                          HoverColor: =myTheme.Icons
                                          Icon: =Icon.Clock
                                          LayoutMinHeight: =28
                                          LayoutMinWidth: =28
                                          PressedColor: =myTheme.Icons
                                          TabIndex: =0
                                          Tooltip: =nfBi("Session time", "Heure de la séance")
                                          Width: =28
                                    - session_con_TimeText:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =myTheme.Transparent
                                          FillPortions: =1
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =0
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =100
                                        Children:
                                          - session_lbl_TimeHeader:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =myTheme.TextMuted
                                                Font: =Font.Lato
                                                FontWeight: =FontWeight.Semibold
                                                Height: =24
                                                LayoutMinHeight: =24
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =9
                                                Text: =nfBi("Time", "Heure")
                                          - session_lbl_TimeValue:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =myTheme.Text
                                                Font: =Font.Lato
                                                FontWeight: =FontWeight.Bold
                                                Height: =26
                                                LayoutMinHeight: =26
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =10
                                                Text: |-
                                                  =Text(
                                                      locTrainingSessionRecord.'Calendar Start Time',
                                                      "[$-en-CA]h:mm AM/PM"
                                                  ) &
                                                  nfBi(" to ", " à ") &
                                                  Text(
                                                      locTrainingSessionRecord.'Calendar End Time',
                                                      "[$-en-CA]h:mm AM/PM"
                                                  )
                              - session_con_LocationInfo:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =myTheme.SurfaceSubtle
                                    FillPortions: =0
                                    Height: =96
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    LayoutMinHeight: =96
                                    LayoutMinWidth: =0
                                    PaddingBottom: =10
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =10
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                  Children:
                                    - session_ico_Location:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          AccessibleLabel: =nfBi("Session location", "Lieu de la séance")
                                          Color: =myTheme.Icons
                                          Height: =28
                                          HoverColor: =myTheme.Icons
                                          Icon: =Icon.Waypoint
                                          LayoutMinHeight: =28
                                          LayoutMinWidth: =28
                                          PressedColor: =myTheme.Icons
                                          TabIndex: =0
                                          Tooltip: =nfBi("Session location", "Lieu de la séance")
                                          Width: =28
                                    - session_con_LocationText:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =myTheme.Transparent
                                          FillPortions: =1
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =0
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =100
                                        Children:
                                          - session_lbl_LocationHeader:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =myTheme.TextMuted
                                                Font: =Font.Lato
                                                FontWeight: =FontWeight.Semibold
                                                Height: =24
                                                LayoutMinHeight: =24
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =9
                                                Text: =nfBi("Location", "Lieu")
                                          - session_lbl_LocationValue:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =myTheme.Text
                                                FillPortions: =1
                                                Font: =Font.Lato
                                                Height: =60
                                                LayoutMinHeight: =52
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =10
                                                Text: |-
                                                  =Concat(
                                                      Filter(
                                                          Table(
                                                              {
                                                                  Value:
                                                                      If(
                                                                          locTrainingSessionRecord.'Virtual Delivery' =
                                                                              'Virtual Delivery (CSC Training Sessions)'.Yes,
                                                                          nfBi("Virtual", "Virtuelle")
                                                                      )
                                                              },
                                                              {
                                                                  Value:
                                                                      locTrainingSessionRecord.'Session Address Line 1' &
                                                                      If(
                                                                          !IsBlank(locTrainingSessionRecord.'Session Address Line 2'),
                                                                          ", " &
                                                                          locTrainingSessionRecord.'Session Address Line 2',
                                                                          ""
                                                                      )
                                                              },
                                                              {
                                                                  Value:
                                                                      locTrainingSessionRecord.'Session City' &
                                                                      If(
                                                                          !IsBlank(locTrainingSessionRecord.'Session Province'.'CSC Lookups ID'),
                                                                          ", " &
                                                                          nfBi(
                                                                              locTrainingSessionRecord.'Session Province'.EN,
                                                                              locTrainingSessionRecord.'Session Province'.FR
                                                                          ),
                                                                          ""
                                                                      )
                                                              },
                                                              {
                                                                  Value:
                                                                      locTrainingSessionRecord.'Session Postal Code'
                                                              }
                                                          ),
                                                          !IsBlank(Value)
                                                      ),
                                                      Value,
                                                      Char(10)
                                                  )
                                                VerticalAlign: =VerticalAlign.Top
                              - session_con_DeadlineInfo:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
