                                    - ts_con_SaveActions:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =myTheme.Transparent
                                          FillPortions: =0
                                          Height: =52
