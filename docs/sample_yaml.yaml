Screens:
  Training Sessions | Séances de formation:
    Properties:
      Fill: =myTheme.Background
      OnHidden: |-
        =Set(ActiveTabID, 1);
        Set(varSelectedTrainingSession, Blank());
        Set(varSessionSortColumn, "AssignedAreaDisplayText");
        Set(varSessionSortOrder, SortOrder.Ascending);
        Clear(colSessionRegistrations)
      OnVisible: |-
        =Set(
            ActiveTabID,
            Coalesce(
                ActiveTabID,
                1
            )
        );
        Set(
            varSelectedTrainingSession,
            Coalesce(
                varSelectedTrainingSession,
                If(
                    !IsBlank(Param("session-id")),
                    LookUp(
                        'CSC Training Sessions',
                        'CSC Training Sessions ID' = GUID(Param("session-id"))
                    )
                )
            )
        );
        Set(
            varSessionSortColumn,
            Coalesce(
                varSessionSortColumn,
                "AssignedAreaDisplayText"
            )
        );
        Set(
            varSessionSortOrder,
            Coalesce(
                varSessionSortOrder,
                SortOrder.Ascending
            )
        );
        Set(
            varSessionRegistrationView,
            Coalesce(
                varSessionRegistrationView,
                "REGISTRATIONS"
            )
        );
        Set(
            varTrainingSessionSortAscending,
            Coalesce(
                varTrainingSessionSortAscending,
                true
            )
        );
        Set(
            varTrainingSessionsRefreshedAt,
            Now()
        );
        If(
            !IsBlank(varSelectedTrainingSession),
            Set(ActiveTabID, 2);
            Select(ts_btn_ReloadRegistrations)
        )
    Children:
      - ts_con_Root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =myTheme.Background
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            Width: =App.Width
          Children:
            - ts_cmp_SideMenu:
                Control: CanvasComponent
                ComponentName: _cx_nav_SideMenu
                Properties:
                  AppName: =nfBi("HR Learning Hub", "Carrefour d'apprentissage des RH")
                  CollapsedWidth: =75
                  ExpandedWidth: =320
                  Fill: =myTheme.Transparent
                  Height: =App.Height
                  HelpURL: =""
                  Logo: =img.Home
                  LogoCompact: =img.Report
                  MenuItems: =tbl.Menus
                  ProfileImage: =User().Image
                  ProfileName: =User().FullName
                  ProfileRole: =nfBi("Employee", "Employé")
                  Width: |-
                    =If(
                        SideMenuCollapsed,
                        Self.CollapsedWidth,
                        Self.ExpandedWidth
                    )
                  svgMode: =true
            - ts_con_Main:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =myTheme.Background
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =10
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =8
                Children:
                  - ts_cmp_HeaderNav:
                      Control: CanvasComponent
                      ComponentName: _cx_nav_HeaderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Fill: =myTheme.Transparent
                        Height: =60
                        LayoutMinHeight: =60
                        LayoutMinWidth: =0
                        NavItems: |-
                          =Table(
                              {
                                  TabName: nfBi(
                                      "Training sessions",
                                      "Séances de formation"
                                  ),
                                  TabID: 1,
                                  TabIcon: img.Calendar,
                                  svgMode: true
                              },
                              {
                                  TabName: nfBi(
                                      "Session details",
                                      "Détails de la séance"
                                  ),
                                  TabID: 2,
                                  TabIcon: img.Analysis,
                                  svgMode: true
                              }
                          )
                        Width: =Parent.Width
                        svgMode: =true
                  - ts_con_PageHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =myTheme.Surface
                        FillPortions: =0
                        Height: =104
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutMinHeight: =104
                        LayoutMinWidth: =0
                        PaddingBottom: =14
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =14
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - ts_con_PageHeaderText:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =myTheme.Transparent
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =220
                            Children:
                              - ts_lbl_PageTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =myTheme.Text
                                    Fill: =myTheme.Transparent
                                    Font: =Font.Lato
                                    FontWeight: =FontWeight.Bold
                                    Height: =40
                                    LayoutMinHeight: =40
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =22
                                    Text: |-
                                      =If(
                                          ActiveTabID = 2,
                                          nfBi(
                                              "Session details",
                                              "Détails de la séance"
                                          ),
                                          nfBi(
                                              "Training sessions",
                                              "Séances de formation"
                                          )
                                      )
                              - ts_lbl_PageSubtitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =myTheme.TextMuted
                                    Fill: =myTheme.Transparent
                                    Font: =Font.Lato
                                    Height: =32
                                    LayoutMinHeight: =32
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Text: |-
                                      =If(
                                          ActiveTabID = 2,
                                          Coalesce(
                                              varSelectedTrainingSession.'Unlisted Course Name',
                                              nfBi(
                                                  varSelectedTrainingSession.Course.'Title EN',
                                                  varSelectedTrainingSession.Course.'Title FR'
                                              )
                                          ),
                                          nfBi(
                                              "Find scheduled learning and manage session attendance from one workspace.",
                                              "Trouvez les formations prévues et gérez la participation aux séances dans un seul espace."
                                          )
                                      )
                        - ts_con_HeaderStatus:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: |-
                                =If(
                                    ActiveTabID = 2 &&
                                    !IsBlank(varSelectedTrainingSession),
                                    myTheme.InformationBackground,
                                    myTheme.SurfaceSubtle
                                )
                              FillPortions: =0
                              Height: =60
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMinHeight: =60
                              LayoutMinWidth: =190
                              PaddingLeft: =12
                              PaddingRight: =12
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Width: =230
                            Children:
                              - ts_ico_HeaderStatus:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    AccessibleLabel: |-
                                      =If(
                                          ActiveTabID = 2,
                                          nfBi("Selected session", "Séance sélectionnée"),
                                          nfBi("Matching sessions", "Séances correspondantes")
                                      )
                                    Color: |-
                                      =If(
                                          ActiveTabID = 2,
                                          myTheme.InformationBackgroundText,
                                          myTheme.Icons
                                      )
                                    Height: =28
                                    HoverColor: =Self.Color
                                    Icon: |-
                                      =If(
                                          ActiveTabID = 2,
                                          Icon.DocumentWithContent,
                                          Icon.CalendarBlank
                                      )
                                    LayoutMinHeight: =28
                                    LayoutMinWidth: =28
                                    PressedColor: =Self.Color
                                    TabIndex: =0
                                    Tooltip: |-
                                      =If(
                                          ActiveTabID = 2,
                                          nfBi("Selected session", "Séance sélectionnée"),
                                          nfBi("Matching sessions", "Séances correspondantes")
                                      )
                                    Width: =28
                              - ts_con_HeaderStatusText:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =myTheme.Transparent
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =0
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =100
                                  Children:
                                    - ts_lbl_HeaderStatusValue:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: |-
                                            =If(
                                                ActiveTabID = 2,
                                                myTheme.InformationBackgroundText,
                                                myTheme.Text
                                            )
                                          Fill: =myTheme.Transparent
                                          Font: =Font.Lato
                                          FontWeight: =FontWeight.Bold
                                          Height: =28
                                          LayoutMinHeight: =28
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =16
                                          Text: |-
                                            =If(
                                                ActiveTabID = 2,
                                                Coalesce(
                                                    varSelectedTrainingSession.Course.Code,
                                                    "–"
                                                ),
                                                Text(
                                                    ts_gal_Sessions.AllItemsCount,
                                                    "#,##0"
                                                )
                                            )
                                    - ts_lbl_HeaderStatusLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: |-
                                            =If(
                                                ActiveTabID = 2,
                                                myTheme.InformationBackgroundText,
                                                myTheme.TextMuted
                                            )
                                          Fill: =myTheme.Transparent
                                          Font: =Font.Lato
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          LayoutMinHeight: =22
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =9
                                          Text: |-
                                            =If(
                                                ActiveTabID = 2,
                                                nfBi(
                                                    "Selected session",
                                                    "Séance sélectionnée"
                                                ),
                                                nfBi(
                                                    "Matching sessions",
                                                    "Séances correspondantes"
                                                )
                                            )
                  - ts_con_SessionsPage:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =myTheme.Transparent
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =Coalesce(ActiveTabID, 1) = 1
                      Children:
                        - ts_con_SearchBar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =myTheme.Surface
                              FillPortions: =0
                              Height: =60
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMinHeight: =60
                              LayoutMinWidth: =0
                              PaddingBottom: =8
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =8
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                            Children:
                              - ts_ico_Search:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    AccessibleLabel: =nfBi("Search", "Rechercher")
                                    Color: =myTheme.IconsMuted
                                    Height: =24
                                    HoverColor: =myTheme.Icons
                                    Icon: =Icon.Search
                                    LayoutMinHeight: =24
                                    LayoutMinWidth: =24
                                    PressedColor: =myTheme.Icons
                                    TabIndex: =0
                                    Tooltip: =nfBi("Search training sessions", "Rechercher des séances de formation")
                                    Width: =24
                              - ts_txt_Search:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    AccessibleLabel: =nfBi("Search training sessions", "Rechercher des séances de formation")
                                    BorderColor: =myTheme.Border
                                    BorderThickness: =1
                                    Color: =myTheme.InputText
                                    Default: =""
                                    DisabledBorderColor: =myTheme.Border
                                    DisabledColor: =myTheme.DisabledText
                                    DisabledFill: =myTheme.InputDisabled
                                    Fill: =myTheme.Input
                                    FillPortions: =1
                                    FocusedBorderColor: =myTheme.Focus
                                    FocusedBorderThickness: =2
                                    Font: =Font.Lato
                                    Height: =42
                                    HintText: =nfBi("Search by course, session or location", "Rechercher par cours, séance ou emplacement")
                                    HoverBorderColor: =myTheme.BorderStrong
                                    HoverColor: =myTheme.InputText
                                    HoverFill: =myTheme.InputHover
                                    LayoutMinHeight: =42
                                    LayoutMinWidth: =200
                                    PaddingLeft: =12
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =11
                              - ts_ico_SortSessions:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    AccessibleLabel: |-
                                      =If(
                                          varTrainingSessionSortAscending,
                                          nfBi("Sort latest first", "Trier les plus récentes en premier"),
                                          nfBi("Sort earliest first", "Trier les plus anciennes en premier")
                                      )
                                    Color: =myTheme.Icons
                                    Height: =36
                                    HoverColor: =myTheme.SecondaryHover
                                    Icon: =If(varTrainingSessionSortAscending, Icon.SortUp, Icon.SortDown)
                                    LayoutMinHeight: =36
                                    LayoutMinWidth: =36
                                    OnSelect: =Set(varTrainingSessionSortAscending, !varTrainingSessionSortAscending)
                                    PressedColor: =myTheme.SecondaryPressed
                                    TabIndex: =0
                                    Tooltip: |-
                                      =If(
                                          varTrainingSessionSortAscending,
                                          nfBi("Sort latest first", "Trier les plus récentes en premier"),
                                          nfBi("Sort earliest first", "Trier les plus anciennes en premier")
                                      )
                                    Width: =36
                              - ts_ico_ResetSessionFilters:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    AccessibleLabel: =nfBi("Reset all filters", "Réinitialiser tous les filtres")
                                    Color: =myTheme.Icons
                                    Height: =36
                                    HoverColor: =myTheme.ClearHover
                                    Icon: =Icon.Reload
                                    LayoutMinHeight: =36
                                    LayoutMinWidth: =36
                                    OnSelect: |-
                                      =Reset(ts_txt_Search);
                                      Reset(ts_cmb_Position);
                                      Reset(ts_cmb_Region);
                                      Reset(ts_cmb_District);
                                      Reset(ts_cmb_Language);
                                      Reset(ts_cmb_Category);
                                      Set(varSelectedTrainingSession, Blank())
                                    PressedColor: =myTheme.ClearPressed
                                    TabIndex: =0
                                    Tooltip: =nfBi("Reset all filters", "Réinitialiser tous les filtres")
                                    Width: =36
                        - ts_con_SessionWorkspace:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =myTheme.Transparent
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =If(App.Width < 1050, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - ts_con_SessionFilters:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =myTheme.Surface
                                    FillPortions: =0
                                    Height: =If(App.Width < 1050, 340, Parent.Height)
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =10
                                    LayoutMinHeight: =320
                                    LayoutMinWidth: =270
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    PaddingBottom: =16
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    PaddingTop: =16
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    Width: =If(App.Width < 1050, Parent.Width, Min(330, Parent.Width * 0.28))
                                  Children:
                                    - ts_con_FilterHeading:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =myTheme.Transparent
                                          FillPortions: =0
                                          Height: =38
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =38
                                          LayoutMinWidth: =0
                                        Children:
                                          - ts_ico_Filter:
                                              Control: Classic/Icon@2.5.0
                                              Properties:
                                                AccessibleLabel: =nfBi("Filters", "Filtres")
                                                Color: =myTheme.Icons
                                                Height: =24
                                                Icon: =Icon.Filter
                                                LayoutMinHeight: =24
                                                LayoutMinWidth: =24
                                                TabIndex: =0
                                                Tooltip: =nfBi("Session filters", "Filtres de séance")
                                                Width: =24
                                          - ts_lbl_FilterHeading:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =myTheme.Text
                                                Fill: =myTheme.Transparent
                                                FillPortions: =1
                                                Font: =Font.Lato
                                                FontWeight: =FontWeight.Bold
                                                Height: =32
                                                LayoutMinHeight: =32
                                                LayoutMinWidth: =100
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =14
                                                Text: =nfBi("Refine results", "Affiner les résultats")
                                    - ts_cmb_Position:
                                        Control: Classic/ComboBox@2.4.0
                                        Properties:
                                          AccessibleLabel: =nfBi("Filter by position", "Filtrer par poste")
                                          BorderColor: =myTheme.Border
                                          BorderThickness: =1
                                          ChevronBackground: =myTheme.Secondary
                                          ChevronDisabledBackground: =myTheme.InputDisabled
                                          ChevronDisabledFill: =myTheme.DisabledText
                                          ChevronFill: =myTheme.SecondaryText
                                          ChevronHoverBackground: =myTheme.SecondaryHover
                                          ChevronHoverFill: =myTheme.SecondaryText
                                          Color: =myTheme.InputText
                                          DefaultSelectedItems: =Filter(tbl.Data.CataloguePositions, Key = "ALL")
                                          DisabledBorderColor: =myTheme.Border
                                          DisabledColor: =myTheme.DisabledText
                                          DisabledFill: =myTheme.InputDisabled
                                          DisplayFields: =["Value"]
                                          Fill: =myTheme.Input
                                          FocusedBorderColor: =myTheme.Focus
                                          FocusedBorderThickness: =2
                                          Font: =Font.Lato
                                          FontWeight: =FontWeight.Semibold
                                          Height: =48
                                          HoverBorderColor: =myTheme.BorderStrong
                                          HoverColor: =myTheme.InputText
                                          HoverFill: =myTheme.InputHover
                                          InputTextPlaceholder: =nfBi("All positions", "Tous les postes")
                                          IsSearchable: =false
                                          Items: =tbl.Data.CataloguePositions
                                          LayoutMinHeight: =48
                                          LayoutMinWidth: =0
                                          NoSelectionText: =nfBi("All positions", "Tous les postes")
                                          PaddingBottom: =6
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          PaddingTop: =6
                                          PressedBorderColor: =myTheme.Focus
                                          PressedColor: =myTheme.InputText
                                          PressedFill: =myTheme.InputPressed
                                          SearchFields: =["Value"]
                                          SelectMultiple: =false
                                          SelectionColor: =myTheme.SelectionText
                                          SelectionFill: =myTheme.Selection
                                          SelectionTagColor: =myTheme.SelectionText
                                          SelectionTagFill: =myTheme.Selection
                                          Size: =11
                                          Tooltip: =nfBi("Select a position", "Sélectionner un poste")
                                    - ts_cmb_Region:
                                        Control: Classic/ComboBox@2.4.0
                                        Properties:
                                          AccessibleLabel: =nfBi("Filter by region", "Filtrer par région")
                                          BorderColor: =myTheme.Border
                                          BorderThickness: =1
                                          ChevronBackground: =myTheme.Secondary
                                          ChevronDisabledBackground: =myTheme.InputDisabled
                                          ChevronDisabledFill: =myTheme.DisabledText
                                          ChevronFill: =myTheme.SecondaryText
                                          ChevronHoverBackground: =myTheme.SecondaryHover
                                          ChevronHoverFill: =myTheme.SecondaryText
                                          Color: =myTheme.InputText
                                          DefaultSelectedItems: =Blank()
                                          DisabledBorderColor: =myTheme.Border
                                          DisabledColor: =myTheme.DisabledText
                                          DisabledFill: =myTheme.InputDisabled
                                          DisplayFields: =["hrbds_code"]
                                          Fill: =myTheme.Input
                                          FocusedBorderColor: =myTheme.Focus
                                          FocusedBorderThickness: =2
                                          Font: =Font.Lato
                                          FontWeight: =FontWeight.Semibold
                                          Height: =48
                                          HoverBorderColor: =myTheme.BorderStrong
                                          HoverColor: =myTheme.InputText
                                          HoverFill: =myTheme.InputHover
                                          InputTextPlaceholder: =nfBi("All regions", "Toutes les régions")
                                          IsSearchable: =false
                                          Items: |-
                                            =Filter(
                                                'CSC Regional Campuses',
                                                'CSC Regional Campuses ID' in nfClientRegions ||
                                                'CSC Regional Campuses ID' in nfUserRegions[@RegionID]
                                            )
                                          LayoutMinHeight: =48
                                          LayoutMinWidth: =0
                                          NoSelectionText: =nfBi("All regions", "Toutes les régions")
                                          OnChange: =Reset(ts_cmb_District)
                                          PaddingBottom: =6
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          PaddingTop: =6
                                          PressedBorderColor: =myTheme.Focus
                                          PressedColor: =myTheme.InputText
                                          PressedFill: =myTheme.InputPressed
                                          SearchFields: =["hrbds_code"]
                                          SelectMultiple: =false
                                          SelectionColor: =myTheme.SelectionText
                                          SelectionFill: =myTheme.Selection
                                          SelectionTagColor: =myTheme.SelectionText
                                          SelectionTagFill: =myTheme.Selection
                                          Size: =11
                                          Tooltip: =nfBi("Select a region", "Sélectionner une région")
                                    - ts_cmb_District:
                                        Control: Classic/ComboBox@2.4.0
                                        Properties:
                                          AccessibleLabel: =nfBi("Filter by district or division", "Filtrer par district ou division")
                                          BorderColor: =myTheme.Border
                                          BorderThickness: =1
                                          ChevronBackground: =myTheme.Secondary
                                          ChevronDisabledBackground: =myTheme.InputDisabled
                                          ChevronDisabledFill: =myTheme.DisabledText
                                          ChevronFill: =myTheme.SecondaryText
                                          ChevronHoverBackground: =myTheme.SecondaryHover
                                          ChevronHoverFill: =myTheme.SecondaryText
                                          Color: =myTheme.InputText
                                          DefaultSelectedItems: =Blank()
                                          DisabledBorderColor: =myTheme.Border
                                          DisabledColor: =myTheme.DisabledText
                                          DisabledFill: =myTheme.InputDisabled
                                          DisplayFields: =["DisplayValue"]
                                          Fill: =myTheme.Input
                                          FocusedBorderColor: =myTheme.Focus
                                          FocusedBorderThickness: =2
                                          Font: =Font.Lato
                                          FontWeight: =FontWeight.Semibold
                                          Height: =48
                                          HoverBorderColor: =myTheme.BorderStrong
                                          HoverColor: =myTheme.InputText
                                          HoverFill: =myTheme.InputHover
                                          InputTextPlaceholder: =nfBi("All districts or divisions", "Tous les districts ou divisions")
                                          Items: |-
                                            =SortByColumns(
                                                AddColumns(
                                                    Filter(
                                                        'CSC Districts Divisions',
                                                        'CSC Districts Divisions ID' in nfUserDistricts[@DistrictID] ||
                                                        'Regional Campus'.'CSC Regional Campuses ID' in nfUserRegions[@RegionID],
                                                        IsBlank(ts_cmb_Region.Selected.'CSC Regional Campuses ID') ||
                                                        'Regional Campus'.'CSC Regional Campuses ID' =
                                                            ts_cmb_Region.Selected.'CSC Regional Campuses ID'
                                                    ),
                                                    DisplayValue,
                                                    nfBi(EN, FR)
                                                ),
                                                "hrbds_nameen",
                                                SortOrder.Ascending
                                            )
                                          LayoutMinHeight: =48
                                          LayoutMinWidth: =0
                                          NoSelectionText: =nfBi("All districts or divisions", "Tous les districts ou divisions")
                                          PaddingBottom: =6
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          PaddingTop: =6
                                          PressedBorderColor: =myTheme.Focus
                                          PressedColor: =myTheme.InputText
                                          PressedFill: =myTheme.InputPressed
                                          SearchFields: =["DisplayValue"]
                                          SelectMultiple: =true
                                          SelectionColor: =myTheme.SelectionText
                                          SelectionFill: =myTheme.Selection
                                          SelectionTagColor: =myTheme.SelectionText
                                          SelectionTagFill: =myTheme.Selection
                                          Size: =11
                                          Tooltip: =nfBi("Select districts or divisions", "Sélectionner des districts ou divisions")
                                    - ts_cmb_Language:
                                        Control: Classic/ComboBox@2.4.0
                                        Properties:
                                          AccessibleLabel: =nfBi("Filter by language", "Filtrer par langue")
                                          BorderColor: =myTheme.Border
                                          BorderThickness: =1
                                          ChevronBackground: =myTheme.Secondary
